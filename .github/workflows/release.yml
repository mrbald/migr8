# Release a tagged candidate to PyPI via trusted publishing (OIDC, no stored
# tokens). One-time setup on pypi.org: Account -> Publishing -> add a pending
# publisher (project migr8, owner mrbald, repository migr8, workflow
# release.yml, environment pypi). Release: docs/RELEASING.md.
#
# Nothing is published that did not pass the whole CI gate list and the
# installed-artifact smoke test. `gates` calls ci.yml, which runs the full suite
# against live Oracle and PostgreSQL. `build` checks the tag, builds the sdist
# and the wheel, and exports the runtime dependency set of each extra from
# uv.lock with hashes. `smoke` starts its own Oracle and PostgreSQL with
# testenv/dbctl.sh, records their versions, and runs scripts/release_smoke.sh on
# the files `build` uploaded: the base wheel against the SQLite example, and
# the wheel with each extra against its live server in a schema of its own.
# `publish` uploads those same files and `release-assets` attaches them, with
# the dependency sets, the server versions and SHA256SUMS, to the GitHub
# release.
#
# The release jobs keep no git credentials and use no uv cache, so nothing a
# cache or an earlier step left behind reaches the candidate.
#
# Publication needs a tag: a tag push, or a manual run (workflow_dispatch) from
# a tag with `publish` set. `release-assets` follows every publish. A manual
# run from any other ref, or without `publish`, is a rehearsal: it runs
# `gates`, `build` and `smoke` and publishes nothing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and create the GitHub release (tag refs only; tag pushes always publish)"
        type: boolean
        default: false

permissions: {}

jobs:
  gates:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # src/migr8/version.py is the version source: pyproject.toml reads it with
      # this pattern, and TOOL_VERSION is written into every durable history
      # row. On a tag ref the tag must name that version and be annotated, since
      # its message is the release note. The explicit fetch keeps the tag
      # object, whatever the checkout did with it.
      - name: the tag names TOOL_VERSION and is annotated
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^TOOL_VERSION = "\([^"]*\)"$/\1/p' src/migr8/version.py)"
          if [ -z "$version" ]; then
            echo "::error::no TOOL_VERSION line in src/migr8/version.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          if [ "$REF_TYPE" != tag ]; then
            echo "rehearsal of $version from $REF: nothing is published"
            exit 0
          fi
          TAG="$REF"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match src/migr8/version.py TOOL_VERSION $version"
            exit 1
          fi
          git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          kind="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$kind" != tag ]; then
            echo "::error::tag $TAG is lightweight ($kind); release tags are annotated"
            exit 1
          fi
          echo "tag $TAG is annotated and matches TOOL_VERSION $version"
      # sdist and wheel are built separately from the tree, so the wheel is
      # not built from the sdist; smoke then rebuilds a wheel from the sdist
      # and compares the two, which catches a file the sdist lost.
      - run: uv build --sdist
      - run: uv build --wheel
      - name: the distributions carry TOOL_VERSION
        run: |
          set -euo pipefail
          ls dist
          test -f "dist/migr8-$version.tar.gz"
          test -f "dist/migr8-$version-py3-none-any.whl"
      # twine is pinned: a check that moves with the tool is not a gate.
      - run: uvx twine==7.0.0 check --strict dist/*
      # The base profile has no runtime dependencies. Each extra's set is the
      # closure gates tested (ci.yml syncs with --locked), with every version
      # pinned and hashed: pinning migr8 alone does not freeze an open-ended
      # driver requirement.
      - name: export the runtime dependency set of each extra (hashes included)
        run: |
          set -euo pipefail
          mkdir exports
          uv export --frozen --no-dev --no-emit-project --extra oracle -o exports/runtime-oracle.txt
          uv export --frozen --no-dev --no-emit-project --extra postgres -o exports/runtime-postgres.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: |
            dist/
            exports/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    # Oracle Free initialises its database on first start; dbctl.sh allows it
    # 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The checkout supplies the script, its example inputs and the test rig;
      # the code under test comes from the candidate only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # the floor of requires-python
      - run: uv python install 3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: candidate
      # dbctl.sh and the provisioning scripts run on .venv/bin/python and need
      # both drivers. migr8 itself stays out of .venv.
      - run: uv sync --locked --all-extras --no-install-project
      - name: start Oracle and PostgreSQL
        run: testenv/dbctl.sh up
      - name: record the server versions the smoke runs against
        run: |
          set -euo pipefail
          testenv/dbctl.sh versions | tee versions.txt
      # Schemas of the smoke's own, so a local run against a developer's rig
      # leaves the suite's MIGR8_TEST and migr8 schemas alone. The script
      # refuses a namespace that is already initialized.
      - name: provision the smoke schemas
        env:
          ORACLE_TEST_USER: MIGR8_SMOKE
          ORACLE_TEST_PASSWORD: migr8_ora_test
          MIGR8_PG_SCHEMA: migr8_smoke
        run: |
          set -euo pipefail
          .venv/bin/python testenv/provision_oracle.py
          .venv/bin/python testenv/provision_postgres.py
      # MIGR8_SMOKE_REQUIRE_LIVE turns a skipped live run into a failure.
      - name: installed-artifact smoke
        env:
          MIGR8_SMOKE_REQUIRE_LIVE: "1"
          MIGR8_SMOKE_ORACLE_DSN: localhost:15210/FREEPDB1
          MIGR8_SMOKE_ORACLE_USER: MIGR8_SMOKE
          MIGR8_SMOKE_ORACLE_PASSWORD: migr8_ora_test
          MIGR8_SMOKE_PG_DSN: host=127.0.0.1 port=15433 dbname=migr8_test
          MIGR8_SMOKE_PG_USER: migr8_test
          MIGR8_SMOKE_PG_PASSWORD: migr8_pg_test
          MIGR8_SMOKE_PG_SCHEMA: migr8_smoke
        run: |
          set -euo pipefail
          PYTHON="$(uv python find --managed-python 3.12)"
          export PYTHON
          bash scripts/release_smoke.sh candidate/dist candidate/exports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servers
          path: versions.txt
          if-no-files-found: error
      - name: service logs
        if: failure()
        run: testenv/dbctl.sh logs
      - name: stop the services
        if: always()
        run: testenv/dbctl.sh destroy

  publish:
    needs: [gates, build, smoke]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/migr8
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: candidate
      # the smoked files, nothing rebuilt; exports/ stays off PyPI
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/

  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # --notes-from-tag reads the annotation from the local repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: servers
          path: servers
      # versions.txt names the Oracle and PostgreSQL servers the smoke ran the
      # installed wheel against.
      - name: assets and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir assets
          cp candidate/dist/* candidate/exports/* servers/versions.txt assets/
          cd assets
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --notes-from-tag assets/*
