# The project's quality gates on every push/PR. Two jobs, because they cost
# very different amounts: `checks` is the fast tier (lint, format, types and
# the 331 service-free tests, about a minute), and `databases` brings up real
# Oracle and PostgreSQL servers and runs the whole suite against them.
# README's "tests" brick badges this workflow, so the badge is green only when
# the live-database gate is green too.
#
# One python version, not a matrix: the package declares requires-python
# >= 3.14 and the code uses 3.14 syntax (PEP 758 unparenthesised except).
# timeout-minutes converts a hung migration or a wedged server into a fast red
# X instead of a six-hour burn.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: uv run ruff check src tests testenv
      - run: uv run ruff format --check src tests testenv
      # Both drivers are installed above, so the adapters are typed against the
      # real modules rather than a missing-import stub.
      - run: uv run mypy
      # The suite runs under branch coverage and the pure decision core is held
      # at 100% of it ([tool.coverage.report] in pyproject names the modules and
      # argues the scope). `coverage run` replaces the bare pytest rather than
      # joining it; the report step is what fails the build.
      - run: uv run coverage run -m pytest -q -m "not oracle and not postgres"
      - run: uv run coverage report

      # A skipped live suite prints "skipped" and exits 0 -- green while testing
      # nothing. This job deliberately has no services, so assert that the
      # deselection is the reason and that the live tests still exist.
      - name: the live suites are deselected here, not missing
        run: |
          set -euo pipefail
          n=$(uv run pytest -q --collect-only -m "oracle or postgres" | grep -c '::' || true)
          if [ "$n" -lt 140 ]; then
            echo "collected $n live-database tests (expected >= 140)."
            echo "the databases job below is what runs them; if they have gone"
            echo "missing, its green tick would mean nothing."
            exit 1
          fi
          echo "collected $n live-database tests, run by the databases job"

  # The acceptance gate. testenv/dbctl.sh is the same script the acceptance
  # report tells a reader to run, so CI exercises the documented path rather
  # than a second, CI-only copy of it that could drift from it.
  #
  # Oracle Free initialises its database on first start, which is the slow part;
  # dbctl.sh waits for the image's own healthcheck and fails loudly rather than
  # letting the suite skip.
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - name: start Oracle and PostgreSQL
        run: testenv/dbctl.sh up
      - name: record the server versions the run is evidence for
        run: testenv/dbctl.sh versions
      # A live suite that skips is not a pass: the fixtures skip when a service
      # is unreachable, which is exactly the failure this job exists to catch.
      - name: full suite against both servers
        run: |
          set -euo pipefail
          testenv/dbctl.sh test -q | tee suite.log
          if grep -qE '[0-9]+ skipped' suite.log; then
            echo "a suite skipped with both services up, so something is"
            echo "unreachable and this job would otherwise have passed green"
            echo "while testing less than it claims."
            exit 1
          fi
      - name: service logs
        if: failure()
        run: testenv/dbctl.sh logs
      - name: stop the services
        if: always()
        run: testenv/dbctl.sh destroy
