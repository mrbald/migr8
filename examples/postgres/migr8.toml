# PostgreSQL is the second adapter. It uses its own transactional DDL and its own
# session-level advisory lock; it does not emulate Oracle.
[database]
adapter = "postgres"
dsn = "host=127.0.0.1 port=15433 dbname=migr8_test user=migr8_test"
user = "migr8_test"
target_schema = "migr8"

[lock]
# A session-level advisory lock survives transaction boundaries, so it is held
# across every commit in the run.
provider = "advisory"
id = 4711
timeout_seconds = 60
