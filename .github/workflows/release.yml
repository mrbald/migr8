# Publish to PyPI via trusted publishing (OIDC, no stored tokens) on version
# tags. One-time setup on pypi.org: Account -> Publishing -> add a pending
# publisher (project migr8, owner mrbald, repository migr8, workflow
# release.yml, environment pypi). Release: git tag vX.Y.Z && git push origin
# vX.Y.Z.
#
# Nothing is published that has not passed the real-database gate. A migration
# engine whose Oracle and PostgreSQL adapters were never run against a server
# in the release build is not a release candidate, so the whole suite runs here
# against the same disposable services CI uses, not just the fast tier.
#
# The suite runs from the checkout, which is not what an operator installs. The
# smoke steps below install the built wheel into clean virtual environments that
# contain nothing else, and run it from outside the source tree: once with no
# extra against SQLite, and once with the oracle extra against the live server
# that is still up at that point. The artifacts published afterwards are the
# ones those steps installed.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras

      # The tag is the release's name and src/migr8/version.py is the version
      # written into every durable history row. A mismatch means a published
      # artifact would record a version nobody can find, so refuse before doing
      # any work.
      - name: the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'from migr8.version import TOOL_VERSION; print(TOOL_VERSION)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match src/migr8/version.py (${pkg})"
            exit 1
          fi
          echo "releasing ${pkg}"

      # The whole repository, the same scope as the tests workflow and AGENTS.md.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run coverage run -m pytest -q -m "not oracle and not postgres"
      - run: uv run coverage report

      - name: start Oracle and PostgreSQL
        run: testenv/dbctl.sh up
      - name: record the server versions this release was built against
        run: testenv/dbctl.sh versions | tee versions.txt
      # A live fixture skips when its service is unreachable or unconfigured,
      # and nothing is published on a suite that quietly did not run. The skips
      # that remain with both services up name a fixture no plain runner has: a
      # bounded filesystem for the ENOSPC case, and an Oracle wallet plus Client
      # libraries for the two certificate tests. docs/ACCEPTANCE.md records
      # running those elsewhere. Print every skip, and fail on a service one.
      - name: full suite against both servers
        run: |
          set -euo pipefail
          testenv/dbctl.sh test -q | tee suite.log
          # pytest colours the summary even when stdout is a pipe.
          skips="$(sed $'s/\x1b\\[[0-9;]*m//g' suite.log | grep '^SKIPPED' || true)"
          echo "${skips:-nothing skipped}"
          if printf '%s\n' "$skips" |
             grep -E 'not reachable|not configured|is unset|could not import'; then
            echo "a live suite skipped with both services up; not releasing"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*

      # The runtime dependency set for each installable profile, with the exact
      # versions and hashes this release resolved. Pinning migr8 alone does not
      # freeze an open-ended driver requirement, so the set is published with it.
      - name: record the runtime dependency set per profile
        run: |
          set -euo pipefail
          uv pip compile pyproject.toml --generate-hashes -o runtime-base.txt
          uv pip compile pyproject.toml --extra oracle --generate-hashes -o runtime-oracle.txt

      - name: the base wheel runs the SQLite example from a clean environment
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          work="$(mktemp -d)"
          cp -r examples/sqlite "$work/example"
          uv venv --python 3.14 "$work/venv"
          uv pip install --python "$work/venv/bin/python" "$wheel"
          # Installed, not imported from the checkout: a source-tree import would
          # test the repository rather than the artifact.
          "$work/venv/bin/python" -c 'import migr8; assert "site-packages" in migr8.__file__, migr8.__file__; print(migr8.__file__)'
          uv pip list --python "$work/venv/bin/python" --format=freeze | tee "$work/installed.txt"
          if grep -Eiq '^(oracledb|psycopg|pytest|ruff|mypy|coverage)' "$work/installed.txt"; then
            echo "the base profile installed more than migr8 and its runtime needs"
            exit 1
          fi
          cd "$work/example"
          "$work/venv/bin/migr8" --version
          "$work/venv/bin/migr8" validate --offline
          "$work/venv/bin/migr8" migrate
          "$work/venv/bin/migr8" validate
          "$work/venv/bin/migr8" status

      # A schema of its own: the suite above leaves MIGR8_TEST bound to its own
      # lock id, and the example is configured for another, so reusing it would
      # fail the binding check by design rather than tell us anything about the
      # wheel.
      - name: the oracle wheel runs against the live server from a clean environment
        env:
          MIGR8_PASSWORD: migr8_ora_test
          ORACLE_TEST_USER: MIGR8_SMOKE
          ORACLE_TEST_PASSWORD: migr8_ora_test
        run: |
          set -euo pipefail
          uv run testenv/provision_oracle.py
          wheel="$(ls dist/*.whl)"
          work="$(mktemp -d)"
          cp -r examples/oracle "$work/example"
          sed -i 's/MIGR8_TEST/MIGR8_SMOKE/g' "$work/example/migr8.toml"
          uv venv --python 3.14 "$work/venv"
          uv pip install --python "$work/venv/bin/python" "${wheel}[oracle]"
          uv pip list --python "$work/venv/bin/python" --format=freeze | tee "$work/installed.txt"
          grep -qi '^oracledb' "$work/installed.txt"
          if grep -qi '^psycopg' "$work/installed.txt"; then
            echo "the oracle profile pulled the PostgreSQL driver"
            exit 1
          fi
          cd "$work/example"
          "$work/venv/bin/migr8" validate --offline
          "$work/venv/bin/migr8" migrate
          "$work/venv/bin/migr8" validate
          "$work/venv/bin/migr8" status

      - name: stop the services
        if: always()
        run: testenv/dbctl.sh destroy

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            versions.txt
            runtime-base.txt
            runtime-oracle.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/migr8
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      # The release notes carry the server versions the build was tested
      # against, because "tested on Oracle" without a release number is not a
      # claim anyone can check.
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Tested against:"
            echo
            echo '```'
            cat versions.txt
            echo '```'
            echo
            echo "The attached runtime-*.txt files are the resolved runtime"
            echo "dependency set for each installable profile, with hashes."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            dist/* runtime-base.txt runtime-oracle.txt
