# Quality gates on every push and pull request.
#
# `checks` runs lint, format, types and the service-free tests under coverage.
# `databases` brings up Oracle and PostgreSQL and runs the whole suite against
# them. README's "tests" badge tracks this workflow, so it covers both jobs.
#
# One Python version: the package requires >= 3.14 and uses 3.14 syntax
# (PEP 758 unparenthesised `except`).

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      # The whole repository, which is the command AGENTS.md documents: the
      # Python blocks in docs/ and the example migrations are checked too.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Both drivers are installed above, so the adapters are typed against the
      # real modules rather than a missing-import stub.
      - run: uv run mypy
      # `coverage report` applies the 100% branch gate over the modules listed
      # in [tool.coverage.report], and is the step that fails the build.
      - run: uv run coverage run -m pytest -q -m "not oracle and not postgres"
      - run: uv run coverage report

      # This job runs no services, so the live tests are deselected. Confirm
      # they still exist: a deleted suite would also deselect to zero.
      - name: the live suites are deselected here, not missing
        run: |
          set -euo pipefail
          n=$(uv run pytest -q --collect-only -m "oracle or postgres" | grep -c '::' || true)
          if [ "$n" -lt 140 ]; then
            echo "expected at least 140 live-database tests; collected $n."
            exit 1
          fi
          echo "collected $n live-database tests, run by the databases job"

  # The acceptance gate. It runs testenv/dbctl.sh, the same script the
  # acceptance report tells a reader to run, so CI cannot drift from it.
  # dbctl.sh waits for each image's healthcheck; Oracle Free initialises its
  # database on first start and is the slow part.
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - name: start Oracle and PostgreSQL
        run: testenv/dbctl.sh up
      - name: record the server versions the run is evidence for
        run: testenv/dbctl.sh versions
      # A live fixture skips when its service is unreachable or unconfigured,
      # which is the failure this job exists to catch. The skips that remain
      # with both services up name a fixture no plain runner has: a bounded
      # filesystem for the ENOSPC case, and an Oracle wallet plus Client
      # libraries for the two certificate tests. docs/ACCEPTANCE.md records
      # running those elsewhere. Print every skip, and fail on a service one.
      - name: full suite against both servers
        run: |
          set -euo pipefail
          testenv/dbctl.sh test -q | tee suite.log
          # pytest colours the summary even when stdout is a pipe.
          skips="$(sed $'s/\x1b\\[[0-9;]*m//g' suite.log | grep '^SKIPPED' || true)"
          echo "${skips:-nothing skipped}"
          if printf '%s\n' "$skips" |
             grep -E 'not reachable|not configured|is unset|could not import'; then
            echo "a live suite skipped with both services up; something is unreachable."
            exit 1
          fi
      - name: service logs
        if: failure()
        run: testenv/dbctl.sh logs
      - name: stop the services
        if: always()
        run: testenv/dbctl.sh destroy
